name: CI

# Formats, lints and tests the Rust workspace on the two platforms Diamond
# ships for. Window tests run headless, so no display is needed.

on:
  push:
    branches: [main, desktop-rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    steps:
      # Actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        # Nothing may stop to ask a question: there is nobody to answer.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo --preserve-env=DEBIAN_FRONTEND apt-get install --no-install-recommends -y \
            build-essential clang cmake pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev

      # The version comes from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
